<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foreground slab prototype</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #f4f6f8; color: #172033; font: 14px/1.45 system-ui, sans-serif; }
      body { padding: 24px; }
      .shell { width: min(920px, calc(100vw - 48px)); margin: 0 auto; }
      .summary { margin: 0 0 12px; color: #516078; }
      #bookmark-status { min-height: 24px; margin-bottom: 6px; color: #516078; }
      #bookmark-stage { position: fixed; left: -200vw; top: 0; width: min(888px, calc(100vw - 80px)); pointer-events: none; }
      #scroll-root {
        height: 600px;
        overflow-y: auto;
        overflow-x: hidden;
        background: #fff;
        border: 1px solid #b8c2d1;
        border-radius: 12px;
        scrollbar-gutter: stable;
        overflow-anchor: auto;
      }
      #slab { min-height: 100%; }
      .history-reveal {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 180ms linear;
      }
      .history-reveal[data-state="revealing"] { grid-template-rows: 1fr; }
      .history-reveal-inner { min-height: 0; overflow: hidden; }
      .spacer { width: 1px; pointer-events: none; }
      .conversation-unit {
        overflow-anchor: auto;
        margin: 0 16px;
        padding: 14px 16px;
        border-bottom: 1px solid #dce2ea;
        background: #fff;
        contain: layout style;
      }
      .conversation-unit:focus-within { outline: 2px solid #4263eb; outline-offset: -2px; }
      .unit-title { margin: 0 0 8px; font-weight: 700; color: #1c345d; }
      .unit-body { white-space: pre-wrap; overflow-wrap: anywhere; }
      .unit-body[data-folded="true"] { max-height: 4.35em; overflow: hidden; }
      .fold-toggle { margin-top: 10px; border: 1px solid #91a0b7; border-radius: 6px; background: #f8fafc; padding: 5px 9px; color: #253957; }
      .focus-target { margin-left: 8px; }
    </style>
  </head>
  <body>
    <main class="shell">
      <p class="summary">Native-scroll foreground slab prototype. Background-prepared units never enter scroll extent before admission.</p>
      <div id="bookmark-status" role="status" aria-live="polite"></div>
      <div id="scroll-root" role="region" aria-label="prototype conversation" tabindex="0">
        <div id="slab">
          <div id="prefix-units"></div>
          <div id="top-spacer" class="spacer" aria-hidden="true"></div>
          <div id="reveal-slot"></div>
          <div id="units"></div>
          <div id="bottom-spacer" class="spacer" aria-hidden="true"></div>
        </div>
      </div>
      <div id="bookmark-stage" aria-hidden="true"></div>
    </main>
    <script type="module" src="./prototype.js"></script>
  </body>
</html>
